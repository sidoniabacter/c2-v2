<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>Autentificare</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">C</div>
        <p class="eyebrow">Contul tău</p>
        <h1 id="login-title">Bine ai revenit</h1>
        <p class="intro">Introdu datele contului pentru a continua.</p>

        <form id="login-form" method="post">
          <div class="field">
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="nume@exemplu.ro"
              required
            >
          </div>

          <div class="field">
            <label for="password">Parolă</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Introdu parola"
              required
            >
          </div>

          <button id="submit-button" type="submit" disabled>Conectează-te</button>
          <p id="login-status" class="status" role="status" aria-live="polite" hidden>
            Autentificarea nu este conectată încă. Datele nu au fost trimise.
          </p>
        </form>
        <noscript>
          <p class="status">Activează JavaScript pentru a folosi formularul.</p>
        </noscript>
      </section>
      <p class="page-note">Acces simplu și sigur la contul tău</p>
    </main>
  </body>
</html>
